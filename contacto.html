<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Computienda - Contacto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="contenedor-principal">

        <header class="barra-navegacion">
            <div class="logo-contenedor">
                <span class="cuadrito-logo"></span>
                <span class="nombre-sitio">🤖 La Computienda 🤖</span>
            </div>
            <nav class="enlaces-menu">
                <a href="index.html">Home</a>
                <a href="productos.html">Productos</a>
                <a href="nosotros.html">Nosotros</a>
                <a href="blogs.html">Blogs</a>
                <a href="contacto.html" class="activo">Contacto</a>
            </nav>
            <div class="info-carrito">
                🛒 Carrito (<span id="contador-carrito">0</span>)
            </div>
        </header>

        <div class="barra-sesion">
            <a href="Inicio-sesion.html">Iniciar sesión</a> |
            <a href="registro.html">Registrar usuario</a>
        </div>

        <main class="seccion-registro">
            <div class="contenedor-formulario">
                <div class="titulo-formulario">Formulario de Contacto</div>

                <form id="formularioContacto" class="formulario-registro" novalidate>
                    <label for="nombreContacto">NOMBRE COMPLETO (*)</label>
                    <input type="text" id="nombreContacto" name="nombreContacto" maxlength="100" placeholder="Ej: Miguel Morales">
                    <span id="errorNombre" class="mensaje-error"></span>

                    <label for="correoContacto">CORREO ELECTRÓNICO (*)</label>
                    <input type="email" id="correoContacto" name="correoContacto" maxlength="100" placeholder="usuario@duoc.cl o gmail.com">
                    <span id="errorCorreo" class="mensaje-error"></span>

                    <label for="comentarioContacto">MENSAJE O COMENTARIO (*)</label>
                    <textarea id="comentarioContacto" name="comentarioContacto" class="campo-textarea" maxlength="500" rows="5" placeholder="Escribe tu mensaje aquí..."></textarea>
                    <span id="errorComentario" class="mensaje-error"></span>

                    <button type="submit" class="boton-registrar">ENVIAR MENSAJE</button>
                    <div id="mensajeExito" class="mensaje-exito"></div>
                </form>
            </div>
        </main>

        <footer class="pie-pagina-izquierda">
            <div class="pie-izquierda">
                <p class="marca-footer">La Computienda</p>
                <p class="pie-copy">© 2026 - Todos los derechos reservados</p>
            </div>
            <div class="pie-pagina-derecha">
                <p>¡Mantente en contacto!</p>
                <div class="formulario-newsletter">
                    <input type="email" placeholder="Ingresa tu correo">
                    <button type="button">Suscribirse</button>
                </div>
            </div>
        </footer>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/contacto.js"></script>
</body>
</html>
