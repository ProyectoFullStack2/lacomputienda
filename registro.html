<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompuTienda - Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="contenedor-principal">

        <header class="barra-navegacion">
            <div class="logo-contenedor">
                <span class="cuadrito-logo"></span>
                <span class="nombre-sitio">CompuTienda</span>
            </div>
            <nav class="enlaces-menu">
                <a href="index.html">Home</a>
                <a href="productos.html">Productos</a>
                <a href="nosotros.html">Nosotros</a>
                <a href="blogs.html">Blogs</a>
                <a href="contacto.html">Contacto</a>
            </nav>
            <div class="info-carrito">
                🛒 Carrito (0)
            </div>
        </header>

        <div class="barra-sesion">
            <a href="iniciar-sesion.html">Iniciar sesión</a> | 
            <a href="registro.html" class="activo">Registrar usuario</a>
        </div>

        <main class="seccion-registro">
            <div class="contenedor-formulario">
                <div class="titulo-formulario">Registro de usuario</div>
                
                <form class="formulario-registro">
                    <label for="nombre">NOMBRE COMPLETO</label>
                    <input type="text" id="nombre" name="nombre" required>

                    <label for="correo">CORREO</label>
                    <input type="email" id="correo" name="correo" required>

                    <label for="correo-conf">CORREO</label>
                    <input type="email" id="correo-conf" name="correo-conf" required>

                    <label for="password">CONTRASEÑA</label>
                    <input type="password" id="password" name="password" required>

                    <label for="password-conf">CONFIRMAR CONTRASEÑA</label>
                    <input type="password" id="password-conf" name="password-conf" required>

                    <label for="telefono">TELÉFONO (opcional)</label>
                    <input type="tel" id="telefono" name="telefono">

                    <div class="contenedor-selects">
                        <div class="grupo-select">
                            <select name="region" id="region">
                                <option value="">-- Seleccione la región --</option>
                                <option value="metropolitana">Región Metropolitana de Santiago</option>
                                <option value="araucania">Región de la Araucanía</option>
                                <option value="nuble">Región de Ñuble</option>
                            </select>
                        </div>

                        <div class="grupo-select">
                            <select name="comuna" id="comuna">
                                <option value="">-- Seleccione la comuna --</option>
                                <option value="linares">Linares</option>
                                <option value="longavi">Longaví</option>
                                <option value="concepcion">Concepción</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="boton-registrar">REGISTRAR</button>
                </form>
            </div>
        </main>

        <footer class="pie-pagina-izquierda">
            <div class="pie-izquierda">
                <p class="marca-footer">CompuTienda</p>
            </div>
            <div class="pie-pagina-derecha">
                <p>¡Mantente en contacto!</p>
                <div class="formulario-newsletter">
                    <input type="email" placeholder="Ingresa tu correo">
                    <button>Suscribirse</button>
                </div>
            </div>
        </footer>

    </div>
</body>
</html>
